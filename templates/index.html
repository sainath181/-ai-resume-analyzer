<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Resume Parser & Optimizer</title>
    <style>
        :root { --p: #4f46e5; --p-h: #4338ca; --s: #10b981; --w: #f59e0b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f1f5f9; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; color: #0f172a; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 750px; margin-bottom: 25px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 15px; font-size: 1rem; }
        textarea { height: 120px; resize: none; }
        .btn { background: var(--p); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; font-size: 1rem; }
        .btn:hover { background: var(--p-h); }
        .btn.download-btn { background: var(--s); margin-top: 15px; }
        .btn.download-btn:hover { background: #059669; }
        h2 { font-size: 1.3rem; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; color: #1e1b4b; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item { background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .full { grid-column: span 2; }
        .lbl { font-weight: 700; color: #64748b; font-size: 0.75rem; text-transform: uppercase; }
        .val { font-size: 1rem; margin-top: 4px; font-weight: 500; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .tag { background: #e0e7ff; color: #4338ca; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .tag.g { background: #d1fae5; color: #065f46; }
        .tag.o { background: #fef3c7; color: #92400e; }
        .circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; color: var(--p); border: 5px solid var(--p); margin: 10px auto; }
        .hide { display: none !important; }

        @media print {
            body { background: white; padding: 0; }
            .box, #optimizerCard, #matchCard, input, .btn { display: none !important; }
            #resultsCard { display: block !important; box-shadow: none !important; border: none !important; padding: 0; width: 100%; max-width: 100%; }
            .item { border: 1px solid #cbd5e1 !important; background: #ffffff !important; }
        }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center;">AI Resume Parser & Optimizer</h2>
        <input type="file" id="resumeFile" accept=".pdf" required>
        <button type="button" class="btn" onclick="uploadResume()">Analyze Resume</button>
    </div>
    
    <div id="loader" class="hide" style="font-weight:600; color:var(--p); padding:10px; text-align:center;">Processing details... Please wait...</div>
    
    <div id="resultsCard" class="box hide">
        <h2>⚡ Extraction Intelligence</h2>
        <div class="grid">
            <div class="item"><div class="lbl">Full Name</div><div id="resName" class="val">-</div></div>
            <div class="item"><div class="lbl">Email</div><div id="resEmail" class="val">-</div></div>
            <div class="item"><div class="lbl">Phone</div><div id="resPhone" class="val">-</div></div>
            <div class="item"><div class="lbl">Location</div><div id="resLocation" class="val">-</div></div>
            <div class="item full"><div class="lbl">Technical Skills</div><div id="resSkills" class="tags"></div></div>
            <div class="item full"><div class="lbl">Education</div><div id="resEducation" class="val">-</div></div>
            <div class="item full"><div class="lbl">Career Objective</div><div id="resObjective" class="val">-</div></div>
        </div>
        <button type="button" class="btn download-btn" onclick="downloadPDFReport()">Download PDF Report</button>
    </div>
    
    <div id="optimizerCard" class="box hide">
        <h2>🎯 ATS Optimization Engine</h2>
        <textarea id="jdInput" placeholder="Paste target corporate job description here..."></textarea>
        <button type="button" class="btn" onclick="matchJob()">Calculate Compatibility Match</button>
    </div>

    <div id="matchCard" class="box hide">
        <h2>📊 ATS Compatibility Audit</h2>
        <div id="matchScore" class="circle">0%</div>
        <div class="grid" style="margin-top:15px;">
            <div class="item full"><div class="lbl">Matched Strengths</div><div id="matchSkills" class="tags"></div></div>
            <div class="item full"><div class="lbl">Missing Critical Keywords</div><div id="missingKeys" class="tags"></div></div>
        </div>
    </div>

<script>
    let activeResumeText = "";

    async function uploadResume() {
        const fileField = document.getElementById('resumeFile');
        if (fileField.files.length === 0) { alert("Select a file first."); return; }
        
        const fd = new FormData(); 
        fd.append("file", fileField.files[0]);
        
        document.getElementById('loader').classList.remove('hide');
        document.getElementById('resultsCard').classList.add('hide');
        document.getElementById('optimizerCard').classList.add('hide');
        document.getElementById('matchCard').classList.add('hide');
        
        try {
            const res = await fetch('/upload-resume/', { method: 'POST', body: fd });
            const data = await res.json();
            document.getElementById('loader').classList.add('hide');
            
            if (res.ok) {
                activeResumeText = data.raw_resume_text;
                const profile = data.analysis;
                
                document.getElementById('resName').innerText = profile.name || 'N/A';
                document.getElementById('resEmail').innerText = profile.email || 'N/A';
                document.getElementById('resPhone').innerText = profile.phone || 'N/A';
                document.getElementById('resLocation').innerText = profile.location || 'N/A';
                document.getElementById('resEducation').innerText = profile.education || 'N/A';
                document.getElementById('resObjective').innerText = profile.career_objective || 'N/A';
                
                const panel = document.getElementById('resSkills'); 
                panel.innerHTML = '';
                if (Array.isArray(profile.skills)) {
                    profile.skills.forEach(s => { panel.innerHTML += `<span class="tag">${s}</span>`; });
                }
                
                document.getElementById('resultsCard').classList.remove('hide');
                document.getElementById('optimizerCard').classList.remove('hide');
            } else { 
                alert("Error from server: " + (data.detail || "Server communication issue.")); 
            }
        } catch (err) { 
            document.getElementById('loader').classList.add('hide'); 
            alert("Connection error to server pipeline."); 
        }
    }

    async function matchJob() {
        const jd = document.getElementById('jdInput').value;
        if (!jd.trim()) { alert("Paste a job description first."); return; }
        
        const fd = new FormData(); 
        fd.append("resume_text", activeResumeText);
        fd.append("job_description", jd);
        
        document.getElementById('loader').classList.remove('hide');
        document.getElementById('matchCard').classList.add('hide');
        
        try {
            const res = await fetch('/match-job/', { method: 'POST', body: fd });
            const data = await res.json();
            document.getElementById('loader').classList.add('hide');
            
            if (res.ok) {
                // FIXED: Direct key mapping to fix the button freeze glitch
                document.getElementById('matchScore').innerText = data.match_percentage + "%";
                
                const sPanel = document.getElementById('matchSkills'); sPanel.innerHTML = '';
                if (Array.isArray(data.matched_skills)) {
                    data.matched_skills.forEach(s => { sPanel.innerHTML += `<span class="tag g">${s}</span>`; });
                }
                
                const mPanel = document.getElementById('missingKeys'); mPanel.innerHTML = '';
                if (Array.isArray(data.missing_keywords)) {
                    data.missing_keywords.forEach(k => { mPanel.innerHTML += `<span class="tag o">${k}</span>`; });
                }
                
                document.getElementById('matchCard').classList.remove('hide');
            } else { 
                alert("Matching failed."); 
            }
        } catch (err) { 
            document.getElementById('loader').classList.add('hide'); 
            alert("Connection error."); 
        }
    }

    function downloadPDFReport() {
        window.print();
    }
</script>
</body>
</html>
